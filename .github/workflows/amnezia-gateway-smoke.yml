name: Amnezia Gateway Smoke

on:
  workflow_dispatch:
  push:
    branches: [amnezia-diagnostic]
    paths:
      - '.github/workflows/amnezia-gateway-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Install crypto dependency
        run: python3 -m pip install --quiet cryptography

      - name: Query public services catalog with extracted public keys
        shell: bash
        run: |
          cat > /tmp/test_gateway.py <<'PY'
          import base64, json, os, uuid, urllib.request, urllib.error
          from cryptography.hazmat.primitives import serialization, padding
          from cryptography.hazmat.primitives.asymmetric import padding as apad
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes

          ENDPOINT='http://gw.amnezia.org:80/v1/services'
          KEYS=[
          '''-----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAwMJbYlGxn3l+0XiGA9I/
          BHK8HX/aet7A9GVL817apDUeL6sdISRBdopv5Y0FdrBHSJWSUdWtVxVazJB46J8x
          327/5H5pi0nkfRbcgxBGSGxhKOvwRe+WPVb2f81jlkenZK46c9C7dNmX/310rlHY
          BwOnZcdw2oKu6hTNDwk3nyUo2v2/leNIMLsv84RlHAX6Tyx5slq8ysewhcmdfv17
          WQjF7albq12ZafTSjtXqDcsrk2oF8mfyzxLjSXbxQHKIDHkfz3SUXCs/H9tt1ydK
          2Yj6nIxv98HESZ8Ng40OZPhHDex8Ru1NjcWlo2EWNM1xT8IqmBT21PLuyzGjNSwG
          Ojnm1V2EcjerVmRNhFTJG70RkURD/i2MDbG+ZKpqPtW1uL8wEt2IkSqNfKcf+TF+
          UJZZfm1lDUMpWJ2eWJGrgOUX8/f8v/GB+x4PxUo1m7V/pDLqCUPm3l2dkaM9P0sM
          6lO0+jKqfIFnG1zjc3if7r1YbDsZlyl389q9Hrh7t+Lwj/JXkDxFaTnudM8egaXk
          GX5YxZiEDmCCLRskRwBBUaYffXIpFbI8sO2Xj0J5/im5xtu7TtfJktcPzDL9uyG1
          Ebt8oSA4FTzTid6Zwj55YgDfz0FMnNmXh80T1xMzlbi6y+BCuna+I+7McMRo8yz3
          VzzYJ0/J7PpHpXoZv7K1qDsCAwEAAQ==
          -----END PUBLIC KEY-----''',
          '''-----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAj5mxl/4DL3Sk89ntxs5G
          X3JawGQWIoq6rvNkOzNGuNgedNS2+pi6hZl3Izl1Io9om4KiUlMT6mgLO1hTr9q+
          s7CYhlvroFA7ErucF+9L+7FCt0Igi0kIK/R2/vxd/2HaUrorn/aSvvutkYwbfxqW
          SwtzE+RuBeDWGvEt937OW0oqYONPYv9E4T56Dz/EZ6v2t8ejAnKLbGD/GocMmipK
          7etFSiSMAB2RmaztqTq4NleBepfO80XpYlW9pCSXuHcE8wxHczkzxsbyMAMsG/K3
          vUQY6qPtohqqzSSBwa/8u2ptNHBeor7l7DdYXeR/Nqcc4z92VUkZ5lOVR4evkS5V
          /wQqp5tnOJEj3NjUhEhXFoNEapbZd1bh6iQoUk7jC1TdvKJ/nPKGZAsHRpr0rNKz
          fx/N/Oo6lr2yh/+ps6VxTkbPmB6E85WOO3UvjImZUY0XQdBjWle/4iJLdEC77Nr0
          jXhdgeypucy6jkB6iBHMeVMlrNMEV7UxoBR/cCNx55zu/8sml5ByiDvCDT7sRomN
          NgVt5S/FaVjYuzFUifJ12ToChXFgESKFmuso7WluEaWvMIGREdrMrKQKHfYLOzWF
          2B5ZJDqw4o03fU4J/6rw61M1b+rjVpXMjPnzc2A+RgcjTvXv955gfZkwe4lt5wk/
          3j8zMVo3+zLrMTAaEeIUM0UCAwEAAQ==
          -----END PUBLIC KEY-----'''
          ]

          def b64(b): return base64.b64encode(b).decode()
          def aes_enc(data,key,iv32):
              pad=padding.PKCS7(128).padder(); pt=pad.update(data)+pad.finalize()
              enc=Cipher(algorithms.AES(key),modes.CBC(iv32[:16])).encryptor()
              return enc.update(pt)+enc.finalize()
          def aes_dec(data,key,iv32):
              dec=Cipher(algorithms.AES(key),modes.CBC(iv32[:16])).decryptor()
              pt=dec.update(data)+dec.finalize()
              un=padding.PKCS7(128).unpadder(); return un.update(pt)+un.finalize()

          payload={
              'os_version':'android',
              'app_version':'5.0.1.5',
              'cli_name':'AmneziaVPN',
              'app_language':'en',
              'installation_uuid':str(uuid.uuid4()),
          }

          for idx,pem in enumerate(KEYS,1):
              key=os.urandom(32); iv=os.urandom(32); salt=os.urandom(8)
              pub=serialization.load_pem_public_key(pem.encode())
              key_payload=json.dumps({'aes_key':b64(key),'aes_iv':b64(iv),'aes_salt':b64(salt)},separators=(',',':')).encode()
              enc_key=pub.encrypt(key_payload,apad.PKCS1v15())
              enc_api=aes_enc(json.dumps(payload,separators=(',',':')).encode(),key,iv)
              body=json.dumps({'key_payload':b64(enc_key),'api_payload':b64(enc_api)},separators=(',',':')).encode()
              req=urllib.request.Request(ENDPOINT,data=body,headers={
                  'Content-Type':'application/json',
                  'X-Client-Request-ID':str(uuid.uuid4()),
                  'User-Agent':'AmneziaVPN/5.0.1.5'
              },method='POST')
              print('KEY',idx,'REQUEST',ENDPOINT)
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      raw=r.read(); print('HTTP',r.status,'bytes',len(raw))
                  try:
                      plain=aes_dec(raw,key,iv)
                      data=json.loads(plain)
                      print('DECRYPT_OK key=',idx)
                      print('user_country_code=',data.get('user_country_code'))
                      services=data.get('services') or []
                      print('service_count=',len(services))
                      for s in services:
                          print('SERVICE',s.get('service_type'),'available=',s.get('is_available'),'protocol=',s.get('service_protocol'),'countries=',s.get('available_countries'))
                      print('RAW_KEYS=',sorted(data.keys()))
                      break
                  except Exception as e:
                      print('DECRYPT_FAIL',type(e).__name__,str(e)[:160], 'raw=',raw[:120])
              except Exception as e:
                  print('HTTP_FAIL',type(e).__name__,str(e)[:200])
          PY
          python3 /tmp/test_gateway.py
