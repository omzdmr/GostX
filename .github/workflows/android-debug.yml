name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install gomobile
        run: |
          MOBILE_VER=v0.0.0-20260520154334-0e4426e1883d
          go install golang.org/x/mobile/cmd/gomobile@$MOBILE_VER
          go install golang.org/x/mobile/cmd/gobind@$MOBILE_VER
          gomobile init

      - name: Prepare Go modules
        run: |
          cd libgost
          go mod download
          go mod tidy
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 go list -deps . >/dev/null

      - name: Build debug APK
        run: make android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GostX-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error