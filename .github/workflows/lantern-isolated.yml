name: Lantern Isolated CI

on:
  workflow_dispatch:
  push:
    branches:
      - lantern-isolated

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.4'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Resolve Lantern modules
        run: |
          cd lanternproc
          go mod download
          go mod tidy
          go list -deps . >/dev/null

      - name: Build and package Lantern arm64 core
        shell: bash
        run: |
          set -euxo pipefail

          DEST="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"

          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android26-clang++"
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          export CGO_LDFLAGS="-Wl,-z,max-page-size=16384"

          cd lanternproc
          go build \
            -trimpath \
            -buildmode=pie \
            -ldflags="-s -w" \
            -o "../$DEST/liblanternproc.so" \
            .
          cd ..

          file "$DEST/liblanternproc.so"
          readelf -h "$DEST/liblanternproc.so" | head -30
          ls -lh "$DEST/liblanternproc.so"

      - name: Build debug APK
        run: make android

      - name: Upload Lantern APK
        uses: actions/upload-artifact@v4
        with:
          name: GostX-Lantern-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Lantern core
        uses: actions/upload-artifact@v4
        with:
          name: LanternCore-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/liblanternproc.so
          if-no-files-found: error