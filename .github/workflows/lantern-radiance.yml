name: Lantern Radiance CI

on:
  workflow_dispatch:
  push:
    branches:
      - lantern-radiance

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout GostX
        uses: actions/checkout@v4

      - name: Apply legacy Lantern stability policy
        run: python3 scripts/apply_lantern_stability_v2.py

      - name: Apply 500 MB UUID rotation policy
        run: python3 scripts/apply_uuid_500mb_rotation.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK used by current Lantern
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Setup Go 1.26.3
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false

      - name: Build official Lantern Radiance novpn process
        shell: bash
        run: |
          set -euxo pipefail
          DEST="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android26-clang++"
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          export CGO_LDFLAGS="-Wl,-z,max-page-size=16384"
          cd radianceproc
          go mod tidy
          go mod download
          go build -mod=mod -tags "novpn,with_gvisor,with_quic,with_wireguard,with_utls,with_grpc" -trimpath -buildmode=pie -ldflags="-s -w -checklinkname=0 -X github.com/getlantern/radiance/common.Version=9.0.29" -o "../$DEST/libradianceproc.so" .
          cd ..
          file "$DEST/libradianceproc.so"

      - name: Setup Go 1.22 for legacy Flashlight fallback
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.4'
          cache: false

      - name: Build legacy Flashlight core for A/B fallback
        shell: bash
        run: |
          set -euxo pipefail
          DEST="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/aarch64-linux-android26-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android26-clang++"
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          export CGO_LDFLAGS="-Wl,-z,max-page-size=16384"
          cd lanternproc
          go mod tidy
          go mod download
          go build -mod=mod -trimpath -buildmode=pie -ldflags="-s -w" -o "../$DEST/liblanternproc.so" .
          cd ..
          file "$DEST/liblanternproc.so"

      - name: Restore Go 1.26.3 for GostX
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false

      - name: Install gomobile for GostX
        shell: bash
        run: |
          set -euxo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$HOME/go/bin:$PATH"
          gomobile init

      - name: Ensure old Lantern AAR is not packaged
        shell: bash
        run: |
          set -euxo pipefail
          rm -f android/app/libs/liblantern.aar

      - name: Build GostX Radiance debug APK
        shell: bash
        run: |
          set -euxo pipefail
          make android 2>&1 | tee gostx-android-build.log

      - name: Upload GostX build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gostx-android-build-log
          path: gostx-android-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Rename APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" GostX-Lantern-Radiance-v2.apk
          sha256sum GostX-Lantern-Radiance-v2.apk
          ls -lh GostX-Lantern-Radiance-v2.apk

      - name: Upload Radiance APK
        uses: actions/upload-artifact@v4
        with:
          name: GostX-Lantern-Radiance-v2
          path: GostX-Lantern-Radiance-v2.apk
          if-no-files-found: error
          retention-days: 30
